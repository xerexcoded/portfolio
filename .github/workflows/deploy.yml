name: Deploy to Xenix

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: xenix-portfolio-production
  cancel-in-progress: false

env:
  REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy tested portfolio revision to Xenix
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require successful CI for the exact requested revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ env.REVISION }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISION&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push")] | sort_by(.updated_at) | last | .conclusion')
          if [ "$conclusion" != success ]; then
            echo "The requested main revision has no successful completed CI run." >&2
            exit 1
          fi
      - name: Configure restricted deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/xenix-portfolio-deploy
          chmod 600 ~/.ssh/xenix-portfolio-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy the CI-tested revision
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REVISION: ${{ env.REVISION }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          for attempt in 1 2 3 4 5; do
            # The script intentionally passes $1 to the nested shell.
            # shellcheck disable=SC2016
            if timeout 10 bash -c ': > /dev/tcp/$1/22' _ "$DEPLOY_HOST" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Xenix SSH endpoint was unreachable after $attempt attempts." >&2
              exit 1
            fi
            echo "Xenix SSH endpoint not reachable; retrying ($attempt/5)." >&2
            sleep 5
          done
          ssh -i ~/.ssh/xenix-portfolio-deploy -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy-portfolio $REVISION"
